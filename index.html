<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Explorer v0 — 透明的 CPU / GPU</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>GPU Explorer <span class="tag">v0 · 教学模型</span></h1>
  <p class="sub">一步一步走完一个过程，随时暂停。切换视图不丢步骤和选中状态。动画时间不是实测性能，内部结构为教学示意，不是真实晶体管布局。</p>
</header>

<section class="controls" aria-label="选择">
  <label>旅程
    <select id="journey-select">
      <option value="gemm">矩阵乘法 C[3,7]</option>
      <option value="pagetable">CPU 页表翻译</option>
      <option value="pixel">一个像素怎么画出来</option>
      <option value="stacking">芯片逻辑折叠剖面</option>
    </select>
  </label>
  <label>型号
    <select id="model-select">
      <option value="h100">H100</option>
      <option value="a100">A100</option>
      <option value="rtx5090">RTX 5090</option>
      <option value="mi300x">AMD MI300X</option>
      <option value="a20pro">Apple A20 Pro（示意）</option>
      <option value="snapdragon">Snapdragon 移动 SoC（示意）</option>
    </select>
  </label>
  <label>对比型号
    <select id="compare-select">
      <option value="">不对比</option>
      <option value="h100">H100</option>
      <option value="a100">A100</option>
      <option value="rtx5090">RTX 5090</option>
      <option value="mi300x">AMD MI300X</option>
      <option value="a20pro">Apple A20 Pro（示意）</option>
      <option value="snapdragon">Snapdragon 移动 SoC（示意）</option>
    </select>
  </label>
  <label>速度
    <select id="speed-select">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
    </select>
  </label>
</section>

<nav class="views" aria-label="视图">
  <button data-view="structure">结构</button>
  <button data-view="work">工作</button>
  <button data-view="data">数据</button>
  <button data-view="timeline">时间</button>
</nav>

<main>
  <h2 id="journey-title"></h2>
  <p id="verdict" class="verdict"></p>
  <p id="model-note" class="note"></p>
  <p id="view-note" class="note"></p>

  <div class="progress" aria-label="旅程进度"><div id="progress-fill"></div></div>
  <nav id="overview" class="overview" aria-label="全部步骤（点一下可跳转）"></nav>

  <div class="diagrams">
    <div id="diagram" class="diagram" aria-label="过程示意图">
      <h3 id="main-model-name" class="diagram-model"></h3>
      <svg id="diagram-svg" viewBox="0 0 1100 520" role="img" aria-label="结构示意图"></svg>
    </div>
    <div id="compare-diagram" class="diagram" aria-label="对比型号示意图" style="display:none">
      <h3 id="compare-model-name" class="diagram-model"></h3>
      <p id="compare-model-note" class="note"></p>
      <svg id="compare-svg" viewBox="0 0 1100 520" role="img" aria-label="对比结构示意图"></svg>
      <p id="compare-step-note" class="trace"></p>
    </div>
  </div>
  <div id="tooltip" class="tooltip" style="display:none"></div>
  <p id="selected-note" class="note"></p>

  <section class="panel">
    <div><span id="step-counter"></span><h3 id="step-title"></h3><p id="step-body"></p><p id="trace" class="trace"></p><section id="predict" class="predict" aria-label="先预测，再看下一步"></section></div>
    <pre id="code-panel" aria-label="相关代码"></pre>
  </section>

  <div class="playback">
    <button id="prev-btn">上一步</button>
    <button id="play-btn">播放</button>
    <button id="next-btn">下一步</button>
    <button id="reset-btn">回到开头</button>
    <span class="hint">键盘：← → 单步，空格 播放/暂停</span>
  </div>
</main>

<footer>
  <p>v0 范围：四个旅程、六个型号（均为教学模型）、四种视图、单步/播放/暂停、先预测再播放、同一旅程同一步的双型号对比。3D 仅在确实有助于表达空间堆叠时再引入；本版全部用轻量 2D 图，避免重型渲染。</p>
</footer>
<script src="state.js"></script>
<script src="app.js"></script>
</body>
</html>
