<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Explorer — 透明的 CPU / GPU</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "./three/three.module.js", "three/addons/": "./three/addons/" } }
</script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo" aria-hidden="true">◈</span><h1>GPU Explorer</h1><span class="tag">教学模型</span></div>
</header>

<div class="shell">
  <aside class="sidebar" aria-label="导航">
    <section>
      <h3>旅程</h3>
      <nav class="nav-list" aria-label="旅程">
        <button class="nav-item" data-journey="gemm"><span class="nav-num">01</span>矩阵乘法 C[3,7]</button>
        <button class="nav-item" data-journey="pagetable"><span class="nav-num">02</span>页表遍历</button>
        <button class="nav-item" data-journey="pixel"><span class="nav-num">03</span>像素着色</button>
        <button class="nav-item" data-journey="stacking"><span class="nav-num">04</span>芯片堆叠</button>
      </nav>
      <p id="journey-gloss" class="gloss"></p>
    </section>
    <section>
      <h3>型号</h3>
      <label class="field">型号
        <select id="model-select">
          <option value="h100">H100</option>
          <option value="a100">A100</option>
          <option value="rtx5090">RTX 5090</option>
          <option value="mi300x">AMD MI300X</option>
          <option value="a20pro">Apple A20 Pro（示意）</option>
          <option value="snapdragon">Snapdragon 移动 SoC（示意）</option>
        </select>
      </label>
      <label class="field">对比型号
        <select id="compare-select">
          <option value="">不对比</option>
          <option value="h100">H100</option>
          <option value="a100">A100</option>
          <option value="rtx5090">RTX 5090</option>
          <option value="mi300x">AMD MI300X</option>
          <option value="a20pro">Apple A20 Pro（示意）</option>
          <option value="snapdragon">Snapdragon 移动 SoC（示意）</option>
        </select>
      </label>
      <label class="field">速度
        <select id="speed-select">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </label>
    </section>
  </aside>

  <main class="canvas-panel">
    <div class="canvas-head">
      <nav id="crumb" class="crumb" aria-label="当前位置"></nav>
      <nav class="views" aria-label="视图">
        <button data-view="structure">结构</button>
        <button data-view="work">工作</button>
        <button data-view="data">数据</button>
        <button data-view="timeline">时间</button>
      </nav>
    </div>
    <div class="diagrams">
      <div id="diagram" class="diagram" aria-label="3D 过程示意图">
        <h3 id="main-model-name" class="diagram-model"></h3>
        <div id="scene3d" class="scene3d" aria-label="可交互 3D 场景：拖动旋转，滚轮缩放，点击方块选中"></div>
        <p class="scene-hint">拖动旋转 · 滚轮缩放 · 点击选中</p>
        <nav class="cam-bar" aria-label="视角预设"><span class="cam-label">视角</span><button data-cam="three-quarter">四分之三</button><button data-cam="top">顶视</button><button data-cam="side">侧视</button></nav>
        <div class="legend-row" aria-label="图例">
          <span><span class="swatch sw-compute"></span>计算</span>
          <span><span class="swatch sw-memory"></span>存储</span>
          <span><span class="swatch sw-data"></span>数据</span>
        </div>
        <nav id="block-list" class="block-list" aria-label="部件列表（键盘可选）"></nav>
      </div>
      <div id="compare-diagram" class="diagram" aria-label="对比型号 3D 示意图" style="display:none">
        <h3 id="compare-model-name" class="diagram-model"></h3>
        <p id="compare-model-note" class="note"></p>
        <div id="scene3d-compare" class="scene3d" aria-label="对比型号 3D 场景"></div>
        <p id="compare-step-note" class="fact"></p>
      </div>
    </div>
  </main>

  <aside class="inspector" aria-label="当前步骤详情">
    <p class="section-label">当前步骤</p>
    <span id="step-counter" class="step-counter"></span>
    <h3 id="step-title"></h3>
    <p id="step-body"></p>
    <p id="fact" class="fact"></p>
    <p class="caveat">本模型为教学示意，数值经简化，非实测性能；内部几何非真实晶体管版图。</p>
    <details id="predict-details">
      <summary>预测</summary>
      <section id="predict" class="predict" aria-label="预测"></section>
    </details>
    <details id="code-details">
      <summary>代码</summary>
      <pre id="code-panel" aria-label="相关代码"></pre>
    </details>
  </aside>
</div>

<div class="bottombar">
  <div class="playback">
    <button id="prev-btn">上一步</button>
    <button id="play-btn" class="play-main">▶ 播放</button>
    <button id="next-btn">下一步</button>
    <button id="reset-btn">回到开头</button>
    <span class="hint">键盘：← → 单步，空格 播放/暂停</span>
    <label class="explode-field">拆开
      <input id="explode-slider" type="range" min="0" max="100" value="0" aria-label="拆开程度">
      <span id="explode-value">0%</span>
    </label>
    <button id="explode-auto-btn">拆开 AUTO</button>
  </div>
  <div class="progress" aria-label="旅程进度"><div id="progress-fill"></div></div>
  <nav id="overview" class="overview" aria-label="阶段（点击可跳转）"></nav>
  <p id="phase-gloss" class="phase-gloss"></p>
</div>
<div id="tooltip" class="tooltip" style="display:none"></div>
<script src="state.js"></script>
<script src="scene-map.js"></script>
<script src="app.js"></script>
<script type="module" src="scene3d.js"></script>
</body>
</html>
